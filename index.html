<div id="hub" class="scr"></div><div id="hangar" class="scr"></div><div id="result" class="scr"></div><div id="pause" class="scr"></div>
<script>
'use strict';
// ---------- procedural anime battle music + sfx (Web Audio) ----------
const AU={ctx:null,cur:null,want:'hub',step:0,nt:0,muted:false,last:{}};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MINOR=[0,2,3,5,7,8,10,12,14,15,17,19],PHRYG=[0,1,3,5,7,8,10,12,13,15,17,19];
const TRACKS={
 hub:{bpm:112,key:57,sc:MINOR,prog:[45,41,48,43],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',b:'0.......0...0...',g:'',arp:1,lead:0,mel:[]},
 main:{bpm:152,key:69,sc:MINOR,prog:[45,41,48,43],k:'x...x...x...x..x',s:'....x.......x...',h:'x.x.x.x.x.x.x.xo',b:'0.0100.00.010.01',g:'x.x.x.x.x.x.x.x.',arp:1,lead:1,
  mel:['4...3.2.0...2.3.','4.5.4.3.2...0...','4...7.6.4...3.2.','3.2.0.2.3...4...']},
 boss:{bpm:174,key:64,sc:PHRYG,prog:[40,41,40,38],k:'xx..x.xxx...x.x.',s:'....x.......x..x',h:'xxxxxxxxxxxxxxxx',b:'0000000000001010',g:'x.xxx.xxx.xxx.x.',arp:0,lead:1,
  mel:['0.1.3.1.0...7.6.','5.3.1.0.1...3...','7...8.7.5.3.1.3.','0.0.1.3.5.3.1.0.']}
};
function auCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;}
function auStart(){
 if(AU.ctx){if(AU.ctx.state!=='running')AU.ctx.resume();return;}
 try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 const c=AU.ctx=new C();
 AU.out=c.createDynamicsCompressor();AU.out.threshold.value=-3;AU.out.ratio.value=20;AU.out.attack.value=.002;AU.out.release.value=.1;AU.out.connect(c.destination);
 AU.mg=c.createGain();AU.mg.gain.value=AU.muted?0:1;AU.mg.connect(AU.out);
 AU.mus=c.createGain();AU.mus.gain.value=.25;AU.mus.connect(AU.mg);
 AU.sfx=c.createGain();AU.sfx.gain.value=.55;AU.sfx.connect(AU.mg);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;
 AU.dist=c.createWaveShaper();AU.dist.curve=auCurve(40);const gl=c.createBiquadFilter();gl.type='lowpass';gl.frequency.value=2600;AU.dist.connect(gl);gl.connect(AU.mus);
 AU.dly=c.createDelay();AU.dly.delayTime.value=60/152*.75;const fb=c.createGain();fb.gain.value=.3;AU.dly.connect(fb);fb.connect(AU.dly);AU.dly.connect(AU.mus);
 AU.nt=c.currentTime+.08;setInterval(auSched,25);
}
function auMute(m){AU.muted=m;if(AU.mg)AU.mg.gain.setTargetAtTime(m?0:1,AU.ctx.currentTime,.02);}
function auTrack(n){AU.want=n;}
function auSched(){const c=AU.ctx;if(!c||c.state!=='running')return;if(AU.muted){AU.nt=c.currentTime+.05;return;}if(AU.cur!==AU.want){AU.cur=AU.want;AU.step=0;AU.nt=Math.max(AU.nt,c.currentTime+.03);}
 const T=TRACKS[AU.cur],spb=60/T.bpm/4;if(AU.nt<c.currentTime-.2)AU.nt=c.currentTime+.03;
 while(AU.nt<c.currentTime+.12){auStep(T,AU.step,AU.nt,spb);AU.nt+=spb;AU.step++;}}
function env(g,t,a,v,d){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function osc(type,f,t,dur,v,dest,a){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);env(g,t,a||.004,v,dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o;}
function noise(t,dur,v,ft,ff,dest,q){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=ft;f.frequency.setValueAtTime(ff,t);if(q)f.Q.value=q;env(g,t,.002,v,dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.05);return f;}
function auStep(T,s,t,spb){
 const st=s%16,bar=Math.floor(s/16),root=T.prog[bar%T.prog.length],sec=Math.floor(s/128)%2,M=AU.mus;
 if(T.k[st]==='x'){const o=osc('sine',160,t,.28,.95,M);o.frequency.exponentialRampToValueAtTime(42,t+.12);}
 if(T.s[st]==='x'){noise(t,.16,.5,'bandpass',1900,M,.8);osc('triangle',200,t,.08,.3,M);}
 if(T.h[st]==='x'||T.h[st]==='o')noise(t,T.h[st]==='o'?.18:.035,.13,'highpass',7500,M);
 const bc=T.b[st];if(bc&&bc!=='.'){const f=mtof(root+(bc==='1'?12:0));const o=osc('sawtooth',f,t,spb*1.6,.28,M);}
 if(T.g&&T.g[st]==='x'){[0,7,12].forEach(iv=>{const o=osc('sawtooth',mtof(root+12+iv)*(1+(Math.random()-.5)*.004),t,spb*1.3,.07,AU.dist);});}
 if(T.lead&&sec===1){const ch=T.mel[bar%T.mel.length][st];if(ch&&ch!=='.'){const n=T.key+T.sc[+ch];['square','sawtooth'].forEach((ty,i)=>{const o=osc(ty,mtof(n)*(i?1.004:1),t,spb*3,.06,M,.01);o.connect&&0;});const o2=osc('square',mtof(n),t,spb*2,.03,AU.dly);}}
 else if(T.arp){const q=(bar%4===0)?3:4,arr=[0,q,7,12,7,q];const n=root+24+arr[st%6];osc('square',mtof(n),t,spb*.8,.035,M);}
}
function sfx(n,v){const c=AU.ctx;if(!c||AU.muted||c.state!=='running')return;const now=c.currentTime;if(AU.last[n]&&now-AU.last[n]<.03)return;if(AU.voices>=24)return;AU.voices=(AU.voices||0)+1;setTimeout(()=>AU.voices--,350);AU.last[n]=now;const t=now+.005,D=AU.sfx;v=v||1;
 switch(n){
 case'blaster':{const o=osc('square',1300,t,.07,.12*v,D);o.frequency.exponentialRampToValueAtTime(380,t+.07);break;}
 case'scatter':{noise(t,.14,.35*v,'lowpass',2600,D);const o=osc('sawtooth',260,t,.1,.18*v,D);o.frequency.exponentialRampToValueAtTime(70,t+.1);break;}
 case'rail':{const o=osc('sawtooth',2400,t,.3,.18*v,D);o.frequency.exponentialRampToValueAtTime(160,t+.28);noise(t,.2,.2*v,'highpass',3000,D);break;}
 case'hit':noise(t,.05,.25*v,'bandpass',3200,D,1.2);break;
 case'ehit':{const o=osc('square',520,t,.05,.08,D);o.frequency.exponentialRampToValueAtTime(200,t+.05);break;}
 case'boom':{const f=noise(t,.45,.6*v,'lowpass',1800,D);f.frequency.exponentialRampToValueAtTime(90,t+.4);const o=osc('sine',120,t,.3,.5*v,D);o.frequency.exponentialRampToValueAtTime(35,t+.3);break;}
 case'dash':{const f=noise(t,.22,.35,'bandpass',600,D,2);f.frequency.exponentialRampToValueAtTime(4000,t+.2);break;}
 case'hurt':{const o=osc('sawtooth',180,t,.18,.3,D);o.frequency.exponentialRampToValueAtTime(60,t+.18);break;}
 case'pick':[0,4,7].forEach((x,i)=>osc('square',mtof(84+x),t+i*.04,.08,.08,D));break;
 case'xp':osc('sine',mtof(91+Math.floor(Math.random()*5)),t,.06,.07,D);break;
 case'item':[0,7,12,16].forEach((x,i)=>osc('triangle',mtof(79+x),t+i*.05,.16,.16,D));break;
 case'level':[0,4,7,12,16,19,24].forEach((x,i)=>osc('square',mtof(72+x),t+i*.06,.2,.1,D));break;
 case'shoot':{const o=osc('square',700,t,.08,.06,D);o.frequency.exponentialRampToValueAtTime(250,t+.08);break;}
 case'warp':{const o=osc('sine',200,t,.4,.12,D);o.frequency.exponentialRampToValueAtTime(1200,t+.35);break;}
 case'roar':{const o=osc('sawtooth',70,t,1.2,.4,D,.1);o.frequency.linearRampToValueAtTime(45,t+1.1);noise(t,1,.3,'lowpass',500,D);break;}
 case'saber':{const o=osc('sawtooth',90,t,.22,.16,D,.01);o.frequency.exponentialRampToValueAtTime(260,t+.08);o.frequency.exponentialRampToValueAtTime(70,t+.22);const o2=osc('sine',180,t,.25,.12,D,.01);o2.frequency.linearRampToValueAtTime(420,t+.1);const f=noise(t,.18,.25,'bandpass',900,D,3);f.frequency.exponentialRampToValueAtTime(3500,t+.12);break;}
 case'click':osc('square',900,t,.03,.06,D);break;
 case'clear':[0,3,7,10,12].forEach((x,i)=>osc('sawtooth',mtof(76+x),t+i*.05,.14,.06,D));break;
 }}

document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else if(!AU.muted)AU.ctx.resume();});
// ---------- data, save, loot, dungeon generation ----------
const TILE=32,MW=30,MH=30;
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(a+R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const RAR=[{n:'Common',c:'#cfd8e3',m:1},{n:'Rare',c:'#3fa9ff',m:1.25},{n:'Epic',c:'#c45cff',m:1.55},{n:'Legendary',c:'#ffb020',m:1.95},{n:'Ultra Rare',c:'#ff4fd8',m:2.3}];
const PREF=['Standard','Tuned','Prototype','Mythic'];
// ---- arms: guns, melee, shields (all fit Main Arm or Off Arm) ----
const WEAP={
 blaster:{k:'gun',n:'Pulse Blaster',dmg:10,rate:6.5,spd:900,spread:.05,count:1,pierce:0,col:'#3ff6ff',r:5,snd:'blaster'},
 scatter:{k:'gun',n:'Scatter Cannon',dmg:6.5,rate:2.1,spd:720,spread:.55,count:6,pierce:0,col:'#ffe23f',r:5,snd:'scatter',range:.42},
 rail:{k:'gun',n:'Rail Lance',dmg:32,rate:1.35,spd:1700,spread:0,count:1,pierce:6,col:'#ff4fd8',r:6,snd:'rail'},
 smg:{k:'gun',n:'Needle SMG',dmg:4.6,rate:13,spd:980,spread:.14,count:1,pierce:0,col:'#9dff5a',r:4,snd:'blaster'},
 launcher:{k:'gun',n:'Nova Launcher',dmg:26,rate:.95,spd:540,spread:.02,count:1,pierce:0,col:'#ff8a1f',r:8,snd:'scatter',splash:72},
 lsword:{k:'melee',n:'Laser Sword',dmg:34,rate:2.6,range:72,arc:2.0,kb:260,col:'#3ff6ff'},
 lgreat:{k:'melee',n:'Great Laser Sword',dmg:54,rate:1.1,range:92,arc:2.5,kb:560,col:'#3ff6ff'},
 ltwin:{k:'melee',n:'Twin Laser Daggers',dmg:13,rate:5.0,range:58,arc:1.7,kb:120,col:'#3ff6ff'},
 buckler:{k:'shield',n:'Energy Buckler',dmg:14,rate:.9,range:44,arc:1.9,armor:.04,col:'#7affd6'},
 tower:{k:'shield',n:'Tower Barrier',dmg:24,rate:.65,range:50,arc:2.7,armor:.16,slow:.1,col:'#3fa9ff'}};
const BLADE=['#3ff6ff','#3f7dff','#c45cff','#ffb020'];
const BASIC_SWORD={k:'melee',dmg:15,rate:2.2,range:66,arc:1.9,kb:220,col:'#7affd6',basic:1};
const SLOTS=['main','off','chip','neural','chest','legs','thrust'];
const SLOTN={main:'Main Arm',off:'Off Arm',chip:'Core Chip',neural:'Neural Link',chest:'Chest Plating',legs:'Leg Servos',thrust:'Thrusters'};
const ITYPE={arm:'Arm',chip:'Core Chip',neural:'Neural Link',chest:'Chest Plating',legs:'Leg Servos',thrust:'Thrusters'};
const slotOf=s=>s==='main'||s==='off'?'arm':s;
const NAMES={chip:['Overclock Chip','Logic Core','Quantum Chip','Fusion Kernel'],neural:['Synapse Relay','Cortex Uplink','Mind Bus','Neural Link'],chest:['Bulwark Carapace','Aegis Plate','Titan Hull','Chest Plating'],legs:['Strider Actuators','Hydraulic Legs','Gyro Struts','Leg Servos'],thrust:['Ion Thrusters','Vector Jets','Plasma Boosters','Phase Drive']};
const AFF=['crit','rate','dmg','spd','regen','hp','xp','ward','armor','dash'];
const AFFL={crit:v=>'+'+Math.round(v*100)+'% crit',rate:v=>'+'+Math.round(v*100)+'% attack rate',dmg:v=>'+'+Math.round(v*100)+'% damage',spd:v=>'+'+Math.round(v*100)+'% move speed',regen:v=>'+'+v.toFixed(1)+' HP/s',hp:v=>'+'+Math.round(v)+' HP',xp:v=>'+'+Math.round(v*100)+'% XP',ward:v=>'+'+Math.round(v*100)+'% vs shields',armor:v=>'+'+Math.round(v*100)+'% armor',dash:v=>'-'+Math.round(v*100)+'% dash cooldown'};
const AFFW={crit:300,rate:300,dmg:300,spd:250,regen:20,hp:1.2,xp:120,ward:120,armor:400,dash:150};
function affVal(k,m,p){return {crit:.04*m,rate:.06*m,dmg:.07*m,spd:.04*m,regen:.5*m*p,hp:12*m*p,xp:.06*m,ward:.25*m,armor:.03*m,dash:.06*m}[k]*rnd(.85,1.15);}
function rollRar(d,min){const r=R();let x=r<.015+.008*d?3:r<.07+.02*d?2:r<.28+.03*d?1:0;return Math.max(x,min||0);}
const IKINDS=['arm','arm','arm','chip','neural','chest','legs','thrust'];
function makeItem(kind,d,rar,type,wave){rar=rar==null?rollRar(d):rar;const m=RAR[rar].m,p=1+.2*(d-1)+.02*(wave||0),it={id:++S.nid,slot:kind,rar,lv:d,aff:{}};
 if(kind==='arm'){const t=type||pick(Object.keys(WEAP)),w=WEAP[t];it.type=t;it.dmg=+(w.dmg*m*p*rnd(.92,1.08)).toFixed(1);it.rate=+(w.rate*rnd(.95,1.05)*(1+.05*rar)).toFixed(2);it.name=PREF[rar]+' '+w.n;if(w.k==='melee'){it.blade=BLADE[rar];it.len=w.range+rar*6;}}
 else if(kind==='chip'){it.dmgB=+(.05*m*rnd(.9,1.1)).toFixed(3);}
 else if(kind==='neural'){it.critB=+(.03*m*rnd(.9,1.1)).toFixed(3);it.xpB=+(.05*m).toFixed(3);}
 else if(kind==='chest'){it.hp=Math.round(40*m*p+6*rar);it.armor=+Math.min(.4,.1*(1+.15*rar)).toFixed(3);}
 else if(kind==='legs'){it.hp=Math.round(22*m*p+4*rar);it.armor=+(.05*(1+.15*rar)).toFixed(3);}
 else if(kind==='thrust'){it.spdB=+(.06*m*rnd(.9,1.1)).toFixed(3);it.dashB=+(.08*m).toFixed(3);}
 if(kind!=='arm')it.name=PREF[rar]+' '+pick(NAMES[kind]);
 const na=rar===0?(R()<.4?1:0):rar;shuffle(AFF.slice()).slice(0,na).forEach(k=>it.aff[k]=+affVal(k,m,p).toFixed(3));
 return it;}

 <div class="bar" style="width:100%"><i style="width:${100*S.xp/need}%"></i></div>
 <div class="st">HP <b>${ps.hp}</b> · DMG <b>${(ps.main?ps.main.dmg:0).toFixed(1)}</b> · Armor <b>${Math.round(ps.armor*100)}%</b> · Crit <b>${Math.round(ps.crit*100)}%</b></div>
 <div class="st" style="color:${S.eq.main?RAR[S.eq.main.rar].c:'#fff'}">${S.eq.main?S.eq.main.name:'No Main Arm'}${S.eq.off?' + '+S.eq.off.name:''}</div>${S.migrated?'<div class="st" style="color:#7affd6">Your old gear was moved into the new slots.</div>':''}${S.medicNew?'<div class="st" style="color:#9dff5a;font-weight:800">🎁 First login reward: Standard Medic Bot is in your inventory (GEAR → Neural).</div>':''}</div>
 <div class="row"><span class="btn gh sm" id="dm">◀</span><div class="pn" style="text-align:center;min-width:130px"><div class="st">DEPTH</div><b style="font-size:22px;font-style:italic">SECTOR ${S.selD}</b><div class="st">Best wave: ${(S.bestW&&S.bestW[S.selD])||0}${S.selD>=S.maxD?' · beat wave 5 to unlock next':''}</div></div><span class="btn gh sm" id="dp">▶</span></div>
 <div class="row"><span class="btn pk" id="go">DEPLOY ▶</span><span class="btn" id="hg">GEAR</span><span class="btn gh sm" id="mu">${S.mute?'🔇':'🔊'}</span></div>
 <div class="st" style="opacity:.7">Survive the waves · guardian every 5th wave · extract after it for a bonus</div>`;}
function showHub(){G=null;auTrack('hub');$('hub').innerHTML=hubHTML();show('hub');
 $('dm').onclick=()=>{S.selD=Math.max(1,S.selD-1);sfx('click');showHub();};$('dp').onclick=()=>{S.selD=Math.min(S.maxD,S.selD+1);sfx('click');showHub();};
 $('go').onclick=()=>{auStart();sfx('click');startPlay(S.selD);};$('hg').onclick=()=>{sfx('click');showHangar();};
 $('mu').onclick=()=>{S.mute=!S.mute;auMute(S.mute);saveGame();showHub();};}
function startPlay(d){for(const s of[ui.L,ui.R]){s.id=null;s.kx=s.ky=0;}applyIn();startRun(d);show('play');}
// ---------- GEAR: paper doll + inventory (Skyrim-style slots) ----------
const IV={f:'all',r:0,sort:'power',sel:null,inRun:false};
const FILT=[['all','All'],['arm','Arms'],['chip','Chip'],['neural','Neural'],['chest','Chest'],['legs','Legs'],['thrust','Thrust']];
function openGearInRun(){if(!breather())return;G.state='inv';for(const s of[ui.L,ui.R]){s.id=null;s.kx=s.ky=0;}applyIn();IV.inRun=true;showHangar();}
function closeGear(){if(IV.inRun&&G){IV.inRun=false;const k=G.p.hp/G.ps.hp;G.ps=pstats();G.p.hp=Math.max(1,Math.round(G.ps.hp*k));G.state='play';show('play');}else showHub();}
function eqFor(it){if(!it)return null;return it.slot==='arm'?S.eq.main:S.eq[it.slot];}
function cmpArrow(it){const d=itemScore(it)-itemScore(eqFor(it));return d>.5?'<span class="up">▲</span>':d<-.5?'<span class="dn">▼</span>':'';}
function slotTile(s){const it=S.eq[s];const col=it?RAR[it.rar].c:'#556';return `<div class="sl" data-slot="${s}" style="border-color:${col}"><div class="sn">${SLOTN[s]}</div><div class="si" style="color:${col}">${it?it.name:'— empty —'}</div></div>`;}
function showHangar(){const ps=pstats(),n=S.inv.length;let items=S.inv.filter(i=>(IV.f==='all'||i.slot===IV.f)&&i.rar>=IV.r);
 items.sort(IV.sort==='rarity'?(a,b)=>b.rar-a.rar||itemScore(b)-itemScore(a):IV.sort==='new'?(a,b)=>b.id-a.id:(a,b)=>itemScore(b)-itemScore(a));
 const full=n>=INV_CAP?'<span style="color:#ff3d6e;font-weight:900"> FULL: the weakest unlocked item gets auto-scrapped</span>':n>=INV_CAP-5?'<span style="color:#ffd23f;font-weight:800"> almost full</span>':'';
 $('hangar').innerHTML=`<div class="row" style="width:100%;max-width:980px;justify-content:space-between"><div class="ttl" style="font-size:28px">GEAR</div><div class="st">Inventory <b>${n}/${INV_CAP}</b>${full} · Neural Link bots <b style="color:#ff4fd8">${neuralCount()}/${BOT_CAP}</b></div><span class="btn sm" id="hb">${IV.inRun?'▶ RESUME':'◀ BACK'}</span></div>
 <div class="gw"><div class="doll pn"><canvas id="dollc" width="320" height="320"></canvas><div class="sls">${SLOTS.map(slotTile).join('')}</div>
  <div class="st" style="margin-top:6px">HP <b>${ps.hp}</b> · Armor <b>${Math.round(ps.armor*100)}%</b> · Crit <b>${Math.round(ps.crit*100)}%</b> · Speed <b>${Math.round(ps.spd)}</b><br>Main <b>${ps.main?ps.main.dmg.toFixed(1)+' '+(ps.main.k):'—'}</b> · Off <b>${ps.off?ps.off.dmg.toFixed(1)+' '+ps.off.k:'—'}</b>${ps.xp?' · XP +'+Math.round(ps.xp*100)+'%':''}${ps.ward?' · vs shields +'+Math.round(ps.ward*100)+'%':''}</div>
    <div class="st" style="opacity:.75">Right stick fires guns in both arms (Off Arm guns at 60% rate) · SWORD button swings your laser sword · shields block bullets in front</div></div>
 <div class="ivr"><div class="tabs" style="flex-wrap:wrap">${FILT.map(([k,l])=>`<span class="btn sm ${IV.f===k?'pk':'gh'}" data-f="${k}">${l}</span>`).join('')}</div>
  <div class="tabs" style="flex-wrap:wrap">${['All','Rare+','Epic+','Legendary'].map((l,i)=>`<span class="btn sm ${IV.r===i?'yl':'gh'}" data-r="${i}">${l}</span>`).join('')}<span class="btn sm gh" id="srt">Sort: ${IV.sort}</span></div>
  <div class="grid">${items.length?items.map(it=>`<div class="card" data-id="${it.id}" style="border-color:${RAR[it.rar].c}"><div class="nm" style="color:${RAR[it.rar].c}">${it.lock?'🔒 ':''}${it.name} ${cmpArrow(it)}${it.bt==='medic'&&S.medicNew?' <span class="nw">NEW</span>':''}</div><div class="ds">${ITYPE[it.slot]} · ${RAR[it.rar].n} · Lv${it.lv}</div><div class="ds">${itemDesc(it)}</div></div>`).join(''):'<div class="st">No items here yet. Clear waves and open crates.</div>'}</div></div></div>
 <div id="det" class="det"></div>`;
 show('hangar');drawDoll();
 $('hb').onclick=()=>{sfx('click');closeGear();};
 $('hangar').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{IV.f=b.dataset.f;sfx('click');showHangar();});
 $('hangar').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{IV.r=+b.dataset.r;sfx('click');showHangar();});
 $('srt').onclick=()=>{IV.sort={power:'rarity',rarity:'new',new:'power'}[IV.sort];sfx('click');showHangar();};
 $('hangar').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const s=b.dataset.slot;sfx('click');if(S.eq[s])showDetail(S.eq[s],s);else{IV.f=slotOf(s);showHangar();}});
 $('hangar').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const it=S.inv.find(x=>x.id==b.dataset.id);if(it){sfx('click');showDetail(it);}});}
function drawDoll(){const c=$('dollc');if(!c)return;const g=c.getContext('2d'),old=cx;g.clearRect(0,0,320,320);g.save();g.translate(160,160);g.scale(5,5);g.translate(-160/5*0,0);cx=g;try{g.translate(0,0);drawPlayer(0,0,-Math.PI/2,-Math.PI/2,false,1,0,0,false,S.eq);}finally{cx=old;}g.restore();}
function cmpTable(it,eq){const a=itemStats(eq),b=itemStats(it),ml=x=>x&&x.slot==='arm'&&WEAP[x.type].k==='melee';if(ml(it)||ml(eq))for(const o of[a,b])if('Shots/s' in o){o['Swings/s']=o['Shots/s'];delete o['Shots/s'];}const keys=[...new Set([...Object.keys(b),...Object.keys(a)])];
 return `<table class="cmp"><tr><th></th><th>Equipped</th><th>This</th><th></th></tr>${keys.map(k=>{const x=a[k]||0,y=b[k]||0,d=+(y-x).toFixed(1);return `<tr><td>${k.replace('*','')}</td><td>${x||'–'}</td><td>${y||'–'}</td><td class="${d>0?'up':d<0?'dn':''}">${d>0?'+'+d:d<0?d:''}</td></tr>`;}).join('')}</table>`;}
function showDetail(it,eqSlot){if(it.bt==='medic'&&S.medicNew){S.medicNew=0;saveGame();}const det=$('det'),isEq=!!eqSlot,arm=it.slot==='arm';const eq=isEq?null:eqFor(it);
 const scrXp=Math.round((6+10*it.rar*it.rar)*(1+.3*(it.lv-1)));
 det.innerHTML=`<div class="pn dbox"><div class="nm" style="color:${RAR[it.rar].c};font-size:18px;font-weight:900">${it.name}</div><div class="ds">${ITYPE[it.slot]} · ${RAR[it.rar].n} · Lv${it.lv}${isEq?' · equipped in '+SLOTN[eqSlot]:''}</div><div class="ds" style="margin:4px 0">${itemDesc(it)}</div>
 ${isEq?'':cmpTable(it,eq)}${!isEq&&arm&&S.eq.off?'<div class="ds">vs Off Arm:</div>'+cmpTable(it,S.eq.off):''}
 <div class="row">${isEq?(eqSlot!=='main'?'<span class="btn sm gh" id="dun">UNEQUIP</span>':''):arm?'<span class="btn" id="dem">EQUIP MAIN</span><span class="btn" id="deo">EQUIP OFF</span>':'<span class="btn" id="de">EQUIP</span>'}
 ${isEq?'':`<span class="btn sm ${it.lock?'yl':'gh'}" id="dl">${it.lock?'🔒 LOCKED':'🔓 LOCK'}</span><span class="btn sm pk" id="ds" style="${it.lock?'opacity:.35':''}">SCRAP +${scrXp} XP</span>`}<span class="btn sm gh" id="dx">CLOSE</span></div></div>`;
 det.classList.add('on');const eqp=s=>{const i=S.inv.indexOf(it);if(i<0)return;S.inv.splice(i,1);if(S.eq[s])S.inv.push(S.eq[s]);S.eq[s]=it;saveGame();sfx('item');showHangar();};
 $('dx').onclick=()=>{det.classList.remove('on');};
 if($('de'))$('de').onclick=()=>eqp(it.slot);if($('dem'))$('dem').onclick=()=>eqp('main');if($('deo'))$('deo').onclick=()=>eqp('off');
 if($('dun'))$('dun').onclick=()=>{S.inv.push(S.eq[eqSlot]);S.eq[eqSlot]=null;saveGame();sfx('click');showHangar();};
 if($('dl'))$('dl').onclick=()=>{it.lock=!it.lock;saveGame();sfx('click');showDetail(it);};
 if($('ds'))$('ds').onclick=()=>{if(it.lock)return;const i=S.inv.indexOf(it);if(i<0)return;S.inv.splice(i,1);scrapItem(it);saveGame();sfx('pick');showHangar();};}
function showResult(){const win=G.state==='win';const its=G.items.slice().sort((a,b)=>b.rar-a.rar);
 $('result').innerHTML=`<div class="ttl" style="font-size:38px">${win?'EXTRACTED!':'SYSTEM DOWN'}</div><div class="sub">${win?'Extraction bonus ×1.5 + bonus item':'Gear and XP are kept. Rebuild and redeploy.'}</div>
 <div class="pn" style="min-width:260px"><div class="st">Kills <b>${G.kills}</b> · Waves survived <b>${G.cleared}</b>${G.newBest?' <b style="color:#ffd23f">NEW BEST</b>':''} · Bonus <b>+${G.bonus||0} XP</b> · XP <b>+${G.xp}</b>${G.lvls?' · <b style="color:#7affd6">+'+G.lvls+' LV</b>':''}</div>
 ${its.length?its.slice(0,6).map(i=>`<div class="st" style="color:${RAR[i.rar].c};font-weight:800">${i.name}</div>`).join('')+(its.length>6?`<div class="st">+${its.length-6} more</div>`:''):'<div class="st">No loot this run</div>'}</div>
 <div class="row"><span class="btn yl" id="rr">RETRY ↻</span><span class="btn pk" id="rh">TO HUB</span><span class="btn" id="rg">GEAR</span></div>`;show('result');
 const rd=G.d;$('rr').onclick=()=>{sfx('click');startPlay(rd);};$('rh').onclick=()=>{sfx('click');showHub();};$('rg').onclick=()=>{sfx('click');G=null;showHangar();};}
function showPause(){if(!G||G.state!=='play')return;G.state='pause';for(const s of[ui.L,ui.R]){s.id=null;s.kx=s.ky=0;}applyIn();
 $('pause').innerHTML=`<div class="ttl" style="font-size:36px">PAUSED</div><div class="row"><span class="btn pk" id="pr">RESUME</span><span class="btn gh" id="pm">${S.mute?'SOUND ON':'MUTE'}</span><span class="btn gh" id="pq">ABANDON RUN</span></div><div class="st">Loot and XP picked up so far are already saved.</div>`;show('pause');
 $('pr').onclick=()=>{G.state='play';show('play');};$('pm').onclick=()=>{S.mute=!S.mute;auMute(S.mute);saveGame();G.state='play';showPause();};$('pq').onclick=()=>{showHub();};}
// ---------- loop ----------
let lastT=0,fAcc=[],lowCheck=0;
function frame(ts){requestAnimationFrame(frame);const now=ts||performance.now();let dt=lastT?(now-lastT)/1000:1/60;lastT=now;if(dt>1/20)dt=1/20;
 fAcc.push(dt);if(fAcc.length>60)fAcc.shift();if(fAcc.length===60){const a=fAcc.reduce((x,y)=>x+y)/60;ui.fps=1/a;if(ui.scr==='play'&&!Q.low&&a>1/45&&++lowCheck>90){Q.low=true;Q.maxParts=120;layout();}}
 if(ui.scr==='play')applyIn();
 if(ui.scr==='play'&&ui.L.id==null&&!KB.none){if(MS.down&&G){IN.ax=(MS.x-W/2);IN.ay=(MS.y-H/2);IN.amag=1;}else if(ui.R.id==null)IN.amag=0;}
 if(G){const sh=G.D.shape,zk=((sh==='tall'&&W>H)||(sh==='wide'&&H>W))?.85:1;VS=VSB*zk;}
 if(G&&(ui.scr==='play'||ui.scr==='result'))update(dt);
 render();}
Q.low=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3;if(Q.low)Q.maxParts=120;
loadGame();AU.muted=!!S.mute;layout();showHub();requestAnimationFrame(frame);
window.__RC={get G(){return G},get S(){return S},IN,ui,Q,start:startPlay,update,render,layout,toHub:showHub,hangar:showHangar,openGearInRun,closeGear,IV,genDungeon,bot:false,god:false,showFps:false,applyIn};
</script></body></html>
